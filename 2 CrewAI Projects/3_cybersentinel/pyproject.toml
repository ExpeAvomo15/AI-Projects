[project]
name = "cybersentinel"
version = "0.1.0"
description = "CyberSentinel using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]>=0.165.1,<1.0.0"
]

[project.scripts]
cybersentinel = "cybersentinel.main:run"
run_crew = "cybersentinel.main:run"
train = "cybersentinel.main:train"
replay = "cybersentinel.main:replay"
test = "cybersentinel.main:test"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
